<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دعوة زفاف محمد و ريان</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=Amiri:wght@400;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: "Cairo", sans-serif;
    background: #f8f2ec;
    color: #4a3832;
    overflow-x: hidden;
}

/* =========================
   الخلفية
========================= */

.hero {
    min-height: 100vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;

    background:
        linear-gradient(
            rgba(255,248,241,0.72),
            rgba(247,232,221,0.86)
        ),
        url("https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=2000&q=90");

    background-size: cover;
    background-position: center;
}

.hero::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.8), transparent 25%),
        radial-gradient(circle at 80% 80%, rgba(255,215,190,.35), transparent 30%);
}

/* =========================
   الورود
========================= */

.flower {
    position: absolute;
    font-size: 45px;
    opacity: .7;
    animation: floatFlower linear infinite;
    pointer-events: none;
}

.flower:nth-child(1) {
    left: 7%;
    top: 10%;
    animation-duration: 9s;
}

.flower:nth-child(2) {
    left: 88%;
    top: 18%;
    animation-duration: 11s;
}

.flower:nth-child(3) {
    left: 13%;
    bottom: 12%;
    animation-duration: 13s;
}

.flower:nth-child(4) {
    right: 8%;
    bottom: 15%;
    animation-duration: 10s;
}

@keyframes floatFlower {
    0%,100% {
        transform: translateY(0) rotate(0deg);
    }

    50% {
        transform: translateY(-30px) rotate(15deg);
    }
}

/* =========================
   البطاقة
========================= */

.card {
    position: relative;
    z-index: 5;

    width: min(90%, 720px);
    padding: 70px 35px;

    text-align: center;

    background: rgba(255,255,255,.72);
    backdrop-filter: blur(15px);

    border: 1px solid rgba(255,255,255,.8);

    border-radius: 35px;

    box-shadow:
        0 30px 80px rgba(90,55,40,.20),
        inset 0 0 40px rgba(255,255,255,.35);

    animation: cardIn 1.5s ease;
}

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(70px) scale(.92);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.small-title {
    font-size: 17px;
    letter-spacing: 4px;
    color: #a77762;
    margin-bottom: 15px;
}

.invitation {
    font-family: "Amiri", serif;
    font-size: 25px;
    margin-bottom: 20px;
}

.names {
    font-family: "Amiri", serif;
    font-size: clamp(55px, 10vw, 90px);
    color: #795548;
    line-height: 1.1;

    text-shadow:
        2px 3px 0 rgba(255,255,255,.8);

    animation: namesGlow 3s ease-in-out infinite;
}

@keyframes namesGlow {
    0%,100% {
        text-shadow: 2px 3px 0 rgba(255,255,255,.8);
    }

    50% {
        text-shadow:
            0 0 20px rgba(170,120,95,.25),
            2px 3px 0 rgba(255,255,255,.8);
    }
}

.and {
    font-family: "Amiri", serif;
    font-size: 35px;
    color: #b88b76;
    margin: 10px 0;
}

.line {
    width: 120px;
    height: 1px;
    background: #b99583;
    margin: 25px auto;
}

.date {
    font-size: 24px;
    font-weight: 600;
    color: #765447;
}

.day {
    font-size: 18px;
    color: #a47764;
    margin-top: 5px;
}

.message {
    max-width: 520px;
    margin: 25px auto;
    line-height: 2;
    font-size: 16px;
    color: #6b5750;
}

/* =========================
   الزر
========================= */

.button {
    display: inline-block;
    margin-top: 15px;
    padding: 13px 32px;

    color: white;
    text-decoration: none;

    border-radius: 50px;

    background: linear-gradient(
        135deg,
        #a98270,
        #78584b
    );

    box-shadow: 0 10px 25px rgba(110,75,60,.25);

    transition: .3s;
}

.button:hover {
    transform: translateY(-4px);
    box-shadow: 0 15px 35px rgba(110,75,60,.35);
}

/* =========================
   عداد الوقت
========================= */

.countdown {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 30px;
    flex-wrap: wrap;
}

.time-box {
    width: 75px;
    padding: 12px 5px;

    background: rgba(255,255,255,.7);

    border-radius: 15px;

    box-shadow: 0 5px 20px rgba(80,50,40,.08);
}

.time-box span {
    display: block;
    font-size: 25px;
    font-weight: bold;
    color: #795548;
}

.time-box small {
    color: #9c7a6b;
}

/* =========================
   القلوب
========================= */

.heart {
    position: fixed;
    bottom: -30px;
    pointer-events: none;
    z-index: 20;

    animation: heartUp 5s linear forwards;
}

@keyframes heartUp {
    0% {
        opacity: 0;
        transform: translateY(0) scale(.5) rotate(0);
    }

    15% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform:
            translateY(-110vh)
            translateX(80px)
            scale(1.4)
            rotate(30deg);
    }
}

/* =========================
   الجوال
========================= */

@media(max-width:600px) {

    .card {
        padding: 55px 20px;
    }

    .names {
        font-size: 58px;
    }

    .invitation {
        font-size: 21px;
    }

    .message {
        font-size: 14px;
    }

    .time-box {
        width: 65px;
    }
}

/* =========================
   شاشة البداية
========================= */

.loading {
    position: fixed;
    inset: 0;
    z-index: 999;

    background: #f8f2ec;

    display: flex;
    justify-content: center;
    align-items: center;

    transition: opacity 1s ease, visibility 1s ease;
}

.loading.hide {
    opacity: 0;
    visibility: hidden;
}

.loading-heart {
    font-size: 65px;
    animation: heartbeat 1s infinite;
}

@keyframes heartbeat {
    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.3);
    }
}
</style>
</head>

<body>

<!-- شاشة البداية -->

<div class="loading" id="loading">
    <div class="loading-heart">🤍</div>
</div>


<section class="hero">

    <!-- الزهور -->

    <div class="flower">🌸</div>
    <div class="flower">🌷</div>
    <div class="flower">🌸</div>
    <div class="flower">🌷</div>


    <!-- بطاقة الدعوة -->

    <div class="card">

        <div class="small-title">
            بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ
        </div>

        <div class="invitation">
            بكل الحب والسعادة ندعوكم لمشاركتنا فرحتنا
        </div>

        <div class="line"></div>

        <div class="names">
            محمد
        </div>

        <div class="and">
            &
        </div>

        <div class="names">
            ريان
        </div>

        <div class="line"></div>

        <div class="day">
            يوم الخميس
        </div>

        <div class="date">
            1 / 10
        </div>

        <p class="message">
            وجودكم معنا في هذه الليلة الجميلة
            هو أجمل هدية يمكن أن نحظى بها.
            <br>
            ننتظركم لنحتفل معًا ببداية حكاية جديدة
            مليئة بالحب والفرح 🤍
        </p>

        <div class="countdown">

            <div class="time-box">
                <span id="days">00</span>
                <small>يوم</small>
            </div>

            <div class="time-box">
                <span id="hours">00</span>
                <small>ساعة</small>
            </div>

            <div class="time-box">
                <span id="minutes">00</span>
                <small>دقيقة</small>
            </div>

            <div class="time-box">
                <span id="seconds">00</span>
                <small>ثانية</small>
            </div>

        </div>

        <a href="#" class="button" onclick="createHearts(); return false;">
            🤍 نحتفل سوا 🤍
        </a>

    </div>

</section>


<script>

/* =====================================
   إخفاء شاشة البداية
===================================== */

window.addEventListener("load", () => {

    setTimeout(() => {

        document
            .getElementById("loading")
            .classList.add("hide");

    }, 1200);

});


/* =====================================
   العداد
===================================== */

/*
   غيّر السنة هنا إذا كان المقصود
   1 أكتوبر من سنة أخرى.

   حاليًا تم ضبطه على:
   1 أكتوبر 2026
*/

const weddingDate =
    new Date("October 1, 2026 20:00:00").getTime();


function updateCountdown() {

    const now = new Date().getTime();

    const distance = weddingDate - now;


    if (distance <= 0) {

        document.getElementById("days").innerText = "00";
        document.getElementById("hours").innerText = "00";
        document.getElementById("minutes").innerText = "00";
        document.getElementById("seconds").innerText = "00";

        return;
    }


    const days =
        Math.floor(distance / (1000 * 60 * 60 * 24));

    const hours =
        Math.floor(
            (distance % (1000 * 60 * 60 * 24))
            / (1000 * 60 * 60)
        );

    const minutes =
        Math.floor(
            (distance % (1000 * 60 * 60))
            / (1000 * 60)
        );

    const seconds =
        Math.floor(
            (distance % (1000 * 60))
            / 1000
        );


    document.getElementById("days").innerText =
        String(days).padStart(2, "0");

    document.getElementById("hours").innerText =
        String(hours).padStart(2, "0");

    document.getElementById("minutes").innerText =
        String(minutes).padStart(2, "0");

    document.getElementById("seconds").innerText =
        String(seconds).padStart(2, "0");
}


updateCountdown();

setInterval(updateCountdown, 1000);


/* =====================================
   قلوب متحركة
===================================== */

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";

    const hearts = [
        "🤍",
        "♡",
        "💗",
        "🌸",
        "✨"
    ];

    heart.innerHTML =
        hearts[Math.floor(Math.random() * hearts.length)];

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.fontSize =
        (15 + Math.random() * 25) + "px";

    heart.style.animationDuration =
        (4 + Math.random() * 4) + "s";

    document.body.appendChild(heart);


    setTimeout(() => {
        heart.remove();
    }, 8000);
}


/* قلوب تلقائية */

setInterval(createHeart, 900);


/* =====================================
   عند الضغط على الزر
===================================== */

function createHearts() {

    for (let i = 0; i < 20; i++) {

        setTimeout(() => {
            createHeart();
        }, i * 100);
    }

}

</script>

</body>
</html>
