<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إلى محمد ❤️</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;

            font-family: "Cairo", sans-serif;

            background:
                radial-gradient(circle at 20% 20%, #fff5f7, transparent 30%),
                radial-gradient(circle at 80% 80%, #ffe1e8, transparent 30%),
                linear-gradient(135deg, #fff7f8, #f8e4e8);

            color: #59383f;
        }


        /* =========================
           شاشة البداية
        ========================= */

        .intro {
            position: fixed;
            inset: 0;

            z-index: 1000;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #fff7f8,
                    #f6dce2
                );

            transition: 1.2s ease;
        }

        .intro.hide {
            opacity: 0;
            visibility: hidden;
        }

        .intro-heart {
            font-size: 80px;

            animation:
                heartbeat 1.2s infinite,
                glow 2s infinite alternate;
        }

        .intro h2 {
            margin-top: 20px;

            font-family: "Amiri", serif;

            font-size: 30px;
            color: #8c4f5e;
        }


        @keyframes heartbeat {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.25);
            }

        }


        @keyframes glow {

            from {
                filter: drop-shadow(0 0 5px #ffb7c5);
            }

            to {
                filter: drop-shadow(0 0 25px #ff8fa8);
            }

        }


        /* =========================
           الخلفية المتحركة
        ========================= */

        .background-heart {
            position: fixed;

            bottom: -50px;

            pointer-events: none;

            animation: floatHeart linear forwards;

            opacity: 0;
        }


        @keyframes floatHeart {

            0% {
                opacity: 0;
                transform:
                    translateY(0)
                    rotate(0deg)
                    scale(.5);
            }

            15% {
                opacity: .8;
            }

            100% {
                opacity: 0;

                transform:
                    translateY(-110vh)
                    translateX(100px)
                    rotate(40deg)
                    scale(1.5);
            }

        }


        /* =========================
           الصفحة
        ========================= */

        .page {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 50px 20px;

            position: relative;
        }


        /* =========================
           الرسالة
        ========================= */

        .letter {

            position: relative;

            width: min(92%, 720px);

            padding: 60px 45px;

            text-align: center;

            background:
                rgba(255, 255, 255, .78);

            backdrop-filter: blur(18px);

            border: 1px solid rgba(255,255,255,.9);

            border-radius: 35px;

            box-shadow:
                0 30px 80px rgba(120,60,75,.18),
                inset 0 0 50px rgba(255,255,255,.5);

            animation: letterIn 1.5s ease;

            overflow: hidden;
        }


        @keyframes letterIn {

            from {
                opacity: 0;

                transform:
                    translateY(80px)
                    scale(.9);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* زخرفة */

        .corner {
            position: absolute;

            font-size: 55px;

            opacity: .45;
        }

        .corner.top {
            top: 15px;
            right: 20px;
        }

        .corner.bottom {
            bottom: 15px;
            left: 20px;
        }


        /* =========================
           العنوان
        ========================= */

        .to {
            font-size: 17px;

            letter-spacing: 3px;

            color: #b26c7b;

            margin-bottom: 15px;
        }


        .name {

            font-family: "Amiri", serif;

            font-size: clamp(65px, 13vw, 105px);

            color: #914f61;

            line-height: 1;

            text-shadow:
                2px 3px 0 white,
                0 0 25px rgba(220,110,135,.18);

            animation: nameGlow 3s infinite alternate;
        }


        @keyframes nameGlow {

            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.03);
            }

        }


        .subtitle {

            margin-top: 15px;

            font-family: "Amiri", serif;

            font-size: 25px;

            color: #a66a78;
        }


        .line {

            width: 140px;

            height: 2px;

            margin: 30px auto;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #c78392,
                    transparent
                );
        }


        /* =========================
           الرسالة
        ========================= */

        .message {

            font-family: "Amiri", serif;

            font-size: 23px;

            line-height: 2.1;

            color: #5e4148;

            text-align: right;

            min-height: 380px;
        }


        .message span {
            opacity: 0;

            display: block;

            transform: translateY(10px);

            animation:
                textAppear .8s forwards;
        }


        @keyframes textAppear {

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================
           التوقيع
        ========================= */

        .signature {

            margin-top: 30px;

            font-family: "Amiri", serif;

            font-size: 28px;

            color: #985668;
        }


        .signature-heart {

            display: inline-block;

            animation: heartbeat 1.2s infinite;
        }


        /* =========================
           الزر
        ========================= */

        .love-button {

            margin-top: 30px;

            border: none;

            padding: 15px 38px;

            border-radius: 50px;

            cursor: pointer;

            color: white;

            font-family: "Cairo", sans-serif;

            font-size: 16px;

            background:
                linear-gradient(
                    135deg,
                    #bd7182,
                    #8e4c5e
                );

            box-shadow:
                0 12px 30px rgba(140,70,90,.25);

            transition: .3s;
        }


        .love-button:hover {

            transform: translateY(-5px) scale(1.03);

            box-shadow:
                0 18px 40px rgba(140,70,90,.35);
        }


        .love-button:active {

            transform: scale(.95);
        }


        /* =========================
           قلوب عند الضغط
        ========================= */

        .pop-heart {

            position: fixed;

            pointer-events: none;

            z-index: 999;

            animation:
                popHeart 2.5s ease forwards;
        }


        @keyframes popHeart {

            0% {
                opacity: 1;

                transform:
                    translate(0,0)
                    scale(.4)
                    rotate(0);
            }

            100% {

                opacity: 0;

                transform:
                    translate(
                        calc(-100px + 200px * var(--random)),
                        -300px
                    )
                    scale(1.4)
                    rotate(40deg);
            }

        }


        /* =========================
           نجوم
        ========================= */

        .sparkle {

            position: fixed;

            pointer-events: none;

            color: #d994a4;

            animation: sparkle 1.5s forwards;
        }


        @keyframes sparkle {

            0% {
                opacity: 0;
                transform: scale(0);
            }

            50% {
                opacity: 1;
                transform: scale(1.5);
            }

            100% {
                opacity: 0;
                transform: scale(0);
            }

        }


        /* =========================
           الجوال
        ========================= */

        @media(max-width:600px) {

            .letter {
                padding: 50px 23px;
            }

            .name {
                font-size: 70px;
            }

            .message {
                font-size: 20px;
                line-height: 2;
            }

            .intro h2 {
                font-size: 24px;
            }

        }

    </style>
</head>


<body>


    <!-- شاشة البداية -->

    <div class="intro" id="intro">

        <div class="intro-heart">
            ❤️
        </div>

        <h2>
            عندي رسالة لشخص مميز...
        </h2>

    </div>



    <!-- الصفحة -->

    <main class="page">

        <div class="letter">

            <div class="corner top">
                🌸
            </div>

            <div class="corner bottom">
                🌷
            </div>


            <div class="to">
                إلى أجمل إنسانة في قلبي
            </div>


            <div class="name">
                محمد
            </div>


            <div class="subtitle">
                عروستي وحبيبتي ❤️
            </div>


            <div class="line"></div>


            <div class="message" id="message">

                <!-- JavaScript سيكتب الرسالة هنا -->

            </div>


            <div class="signature">

                أحبك أكثر مما تتخيلين

                <span class="signature-heart">
                    ❤️
                </span>

            </div>


            <button
                class="love-button"
                onclick="sendLove()">

                اضغطي هنا إذا بتحبيني ❤️

            </button>

        </div>

    </main>



    <script>


        /* =================================
           شاشة البداية
        ================================= */

        window.addEventListener("load", function() {

            setTimeout(function() {

                document
                    .getElementById("intro")
                    .classList.add("hide");

            }, 2200);

        });



        /* =================================
           الرسالة
        ================================= */

        const lines = [

            "محمد... ❤️",

            "من بين كل الناس، قلبي اختارك إنتِ.",

            "ويمكن مهما حاولت أوصفلك شو يعني وجودك بحياتي، ما رح ألاقي كلام يكفي يوصف اللي جواتي.",

            "إنتِ مو بس حبيبتي... إنتِ الشخص اللي بوجوده بتصير أيامي أحلى، وضحكتي أصدق، وكل لحظة عادية بتتحول لذكرى حلوة.",

            "بحب تفاصيلك الصغيرة قبل الكبيرة، بحب ضحكتك، كلامك، طريقتك، وحتى الأشياء اللي يمكن إنتِ ما تنتبهي إلها... أنا بحفظها بقلبي.",

            "محمد، إنتِ مو مجرد شخص أحبه... إنتِ الشخص اللي بتمنى أكمل معه كل أيامي.",

            "ولو خيروني ألف مرة، كل مرة رح أختارك إنتِ.",

            "وعد مني إني أضل أحبك، وأضل أختارك كل يوم، وأضل أشوفك أجمل صدفة وأحلى نصيب بحياتي.",

            "أحبك يا محمد... يا عروستي، يا حبيبتي، ويا أجمل شيء صار بقلبي. ❤️"

        ];


        const message =
            document.getElementById("message");


        lines.forEach((line, index) => {

            const span =
                document.createElement("span");

            span.innerHTML = line;

            span.style.animationDelay =
                (index * 0.8 + 1) + "s";

            message.appendChild(span);

        });



        /* =================================
           قلوب الخلفية
        ================================= */

        const heartTypes = [
            "❤️",
            "💕",
            "💗",
            "💖",
            "🤍",
            "🌸"
        ];


        function createBackgroundHeart() {

            const heart =
                document.createElement("div");

            heart.className =
                "background-heart";

            heart.innerHTML =
                heartTypes[
                    Math.floor(
                        Math.random() *
                        heartTypes.length
                    )
                ];

            heart.style.left =
                Math.random() * 100 + "vw";

            heart.style.fontSize =
                (15 + Math.random() * 25) + "px";

            heart.style.animationDuration =
                (5 + Math.random() * 5) + "s";

            document.body.appendChild(heart);


            setTimeout(() => {

                heart.remove();

            }, 10000);

        }


        setInterval(
            createBackgroundHeart,
            700
        );



        /* =================================
           زر الحب ❤️
        ================================= */

        function sendLove() {

            for(let i = 0; i < 30; i++) {

                setTimeout(() => {

                    const heart =
                        document.createElement("div");

                    heart.className =
                        "pop-heart";

                    heart.innerHTML =
                        heartTypes[
                            Math.floor(
                                Math.random() *
                                heartTypes.length
                            )
                        ];

                    heart.style.left =
                        (35 + Math.random() * 30) + "vw";

                    heart.style.top =
                        (45 + Math.random() * 20) + "vh";

                    heart.style.fontSize =
                        (18 + Math.random() * 30) + "px";

                    heart.style.setProperty(
                        "--random",
                        Math.random()
                    );

                    document.body.appendChild(
                        heart
                    );


                    setTimeout(() => {

                        heart.remove();

                    }, 3000);

                }, i * 60);

            }


            /* رسالة مفاجئة */

            setTimeout(() => {

                alert(
                    "بحبك يا محمد ❤️\n\n" +
                    "أكثر مما تقدر الكلمات تحكي."
                );

            }, 900);

        }



        /* =================================
           لمعات عشوائية
        ================================= */

        function sparkle() {

            const star =
                document.createElement("div");

            star.className =
                "sparkle";

            star.innerHTML = "✦";

            star.style.left =
                Math.random() * 100 + "vw";

            star.style.top =
                Math.random() * 100 + "vh";

            star.style.fontSize =
                (10 + Math.random() * 15) + "px";

            document.body.appendChild(star);


            setTimeout(() => {

                star.remove();

            }, 1500);

        }


        setInterval(
            sparkle,
            500
        );


    </script>

</body>
</html>
